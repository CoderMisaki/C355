<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChessMint Settings</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-color: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { width: 300px; background-color: var(--bg-color); color: var(--text-main); padding: 14px; user-select: none; }
    .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand-logo { width: 22px; height: 22px; background: #10b981; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 12px; }
    .brand-title { font-size: 15px; font-weight: 700; }
    .version-tag { font-size: 10px; background: rgba(16, 185, 129, 0.2); color: var(--accent-color); padding: 2px 6px; border-radius: 10px; }
    .control-group { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
    .slider-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .slider-value { color: var(--accent-color); font-weight: 700; }
    input[type="range"] { width: 100%; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); outline: none; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
    .toggle-label { font-size: 12px; font-weight: 500; }
    .switch { position: relative; width: 34px; height: 18px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255, 255, 255, 0.2); transition: .2s; border-radius: 18px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background-color: white; transition: .2s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent-color); }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-logo">M</div>
      <div class="brand-title">ChessMint</div>
    </div>
    <span class="version-tag">v2.0</span>
  </div>

  <div class="control-group">
    <div class="slider-header">
      <span>Engine Depth</span>
      <span id="depth-val" class="slider-value">15</span>
    </div>
    <input type="range" id="option-depth" min="1" max="30" value="15">
  </div>

  <div class="control-group">
    <div class="toggle-row">
      <span class="toggle-label">Show Move Hints</span>
      <label class="switch"><input type="checkbox" id="option-show-hints"><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Progress Bar</span>
      <label class="switch"><input type="checkbox" id="option-depth-bar"><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Evaluation Bar</span>
      <label class="switch"><input type="checkbox" id="option-evaluation-bar"><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Auto Move</span>
      <label class="switch"><input type="checkbox" id="option-auto-move"><span class="slider"></span></label>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
