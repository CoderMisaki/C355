<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChessMint Settings</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-color: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 320px;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .version-tag {
      font-size: 10px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-color);
      padding: 2px 6px;
      border-radius: 12px;
      font-weight: 600;
    }

    .control-group {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .slider-value {
      color: var(--accent-color);
      font-size: 13px;
      font-weight: 700;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }

    .toggle-row:not(:last-child) {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .2s ease;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s ease;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-color);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .warning-box {
      font-size: 11px;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-logo">M</div>
      <div class="brand-title">ChessMint</div>
    </div>
    <span class="version-tag">v2.0</span>
  </div>

  <div class="control-group">
    <div class="slider-header">
      <span>Engine Depth</span>
      <span id="depth-val" class="slider-value">15</span>
    </div>
    <input type="range" id="option-depth" min="1" max="30" value="15">
  </div>

  <div class="control-group">
    <div class="slider-header">
      <span>Threads</span>
      <span id="threads-val" class="slider-value">2</span>
    </div>
    <input type="range" id="option-threads" min="1" max="8" value="2">
  </div>

  <div class="control-group">
    <div class="toggle-row">
      <span class="toggle-label">Show Move Hints</span>
      <label class="switch">
        <input type="checkbox" id="option-show-hints">
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Move Analysis</span>
      <label class="switch">
        <input type="checkbox" id="option-move-analysis">
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Progress Bar</span>
      <label class="switch">
        <input type="checkbox" id="option-depth-bar">
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Evaluation Bar</span>
      <label class="switch">
        <input type="checkbox" id="option-evaluation-bar">
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Auto Move</span>
      <label class="switch">
        <input type="checkbox" id="option-auto-move">
        <span class="slider"></span>
      </label>
    </div>
    <div class="warning-box" id="auto-move-warning" style="display: none;">
      ⚠️ <strong>Notice:</strong> Auto Move is intended for offline/bot testing. Using it in online rated matches violates platform rules.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
